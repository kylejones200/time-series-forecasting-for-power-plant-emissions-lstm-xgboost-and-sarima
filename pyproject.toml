[project]
name = "time-series-forecasting-for-power-plant-emissions-lstm-xgboost-and-sarima"
version = "0.1.0"
description = "Companion code for Medium article: time series forecasting for power plant emissions lstm xgboost and sarima"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "darts>=0.40",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "signalplot>=0.1",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
